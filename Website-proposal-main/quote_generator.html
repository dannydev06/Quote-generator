<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F6;
    --card:#FFFFFF;
    --ink:#1C1F26;
    --muted:#68707C;
    --line:#DEDAD0;
    --line-soft:#EAE7DF;
    --accent:#2F6F5E;
    --accent-soft:#E4EEEA;
    --danger:#A8442E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:840px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  .masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:28px;
  }
  .masthead-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:10px;
  }
  .field-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .field{
    flex:1;
    min-width:140px;
  }
  .field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .field [contenteditable], .field select{
    font-family:'Source Serif 4', serif;
    font-size:15px;
    outline:none;
    border:none;
    border-bottom:1px solid transparent;
    padding:2px 0;
    background:transparent;
    color:var(--ink);
    width:100%;
  }
  .field select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .field [contenteditable]:focus, .field select:focus{ border-bottom:1px solid var(--accent); }
  h1[contenteditable]{
    font-family:'Source Serif 4', serif;
    font-size:32px;
    font-weight:600;
    margin:0;
    outline:none;
    line-height:1.15;
  }
  h1[contenteditable]:focus{ border-bottom:1px solid var(--accent); }

  .project-section, .terms-section, .timeline-section{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 18px 20px;
    margin-bottom:28px;
  }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:14px;
  }
  .project-name{
    font-family:'Source Serif 4', serif;
    font-size:22px;
    font-weight:600;
    outline:none;
    margin-bottom:16px;
    border-bottom:1px solid transparent;
    padding:2px 0;
  }
  .project-name:focus{ border-bottom:1px solid var(--accent); }
  .project-name[data-placeholder]:empty:before,
  .overview-text[data-placeholder]:empty:before,
  .field [contenteditable][data-placeholder]:empty:before{
    content: attr(data-placeholder);
    color:#B6B1A6;
  }
  .subhead{
    font-size:11px;
    color:var(--muted);
    margin:16px 0 6px;
  }
  .overview-text{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.6;
    outline:none;
    min-height:44px;
    border-bottom:1px solid transparent;
    padding:4px 0;
  }
  .overview-text:focus{ border-bottom:1px solid var(--accent); }
  .req-row, .term-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .req-row:last-of-type, .term-row:last-of-type{ border-bottom:none; }
  .req-row .req-mark, .term-row .term-mark{
    font-family:'IBM Plex Mono', monospace;
    color:var(--accent);
    font-size:13px;
    flex-shrink:0;
  }
  .req-row input[type=text], .term-row input[type=text]{
    flex:1;
    border:none;
    background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    outline:none;
    padding:4px 0;
  }
  .term-row input.term-pct{
    width:60px;
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    border-bottom:1px solid var(--line);
  }
  .term-row input.term-pct:focus{ border-bottom-color:var(--accent); }
  .req-row input[type=text]::placeholder, .term-row input[type=text]::placeholder{ color:#B6B1A6; }
  
  .btn-link{
    margin-top:6px;
    background:none;
    border:none;
    color:var(--accent);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    cursor:pointer;
    padding:6px 0;
  }
  .btn-link:hover{ text-decoration:underline; }

  .generator{
    background:var(--ink);
    color:#fff;
    border-radius:2px;
    padding:20px 18px 18px;
    margin-bottom:24px;
  }
  .generator .section-label{ color:#B9C2BE; }
  .generator textarea{
    width:100%;
    min-height:88px;
    background:#2A2E36;
    border:1px solid #3C414C;
    border-radius:2px;
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:10px 12px;
    resize:vertical;
    outline:none;
  }
  .generator textarea:focus{ border-color:var(--accent); }
  .generator textarea::placeholder{ color:#7B818C; }
  .generator-row{
    display:flex;
    justify-space:between;
    align-items:center;
    margin-top:12px;
    gap:12px;
    flex-wrap:wrap;
  }
  .generate-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:2px;
    padding:10px 18px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .generate-btn:hover{ background:#255A4C; }
  .generate-btn:disabled{ background:#4B5158; cursor:default; }
  .generator-status{ font-size:12px; color:#B9C2BE; font-family:'IBM Plex Mono', monospace; }
  .generator-note{ font-size:11px; color:#8991A0; margin-top:8px; }

  .timeline-total{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .timeline-total label{ font-size:12px; color:var(--muted); flex-shrink:0; }
  .timeline-total [contenteditable]{
    font-family:'Source Serif 4', serif;
    font-size:15px;
    outline:none;
    border-bottom:1px solid transparent;
    padding:2px 0;
    flex:1;
  }
  .timeline-total [contenteditable]:focus{ border-bottom:1px solid var(--accent); }
  .phase{
    display:flex;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line-soft);
    align-items:flex-start;
  }
  .phase:last-of-type{ border-bottom:none; }
  .phase-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--accent);
    padding-top:4px;
    flex-shrink:0;
    width:16px;
  }
  .phase-body{ flex:1; min-width:0; }
  .phase-top{ display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .phase-name{
    font-family:'Source Serif 4', serif;
    font-size:16px;
    font-weight:600;
    outline:none;
    border-bottom:1px solid transparent;
    flex:1;
    min-width:120px;
  }
  .phase-name:focus{ border-bottom:1px solid var(--accent); }
  .phase-duration{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--accent);
    outline:none;
    border-bottom:1px solid transparent;
    text-align:right;
    white-space:nowrap;
  }
  .phase-duration:focus{ border-bottom:1px solid var(--accent); }
  .phase-desc{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
    outline:none;
    margin-top:4px;
    border-bottom:1px solid transparent;
    padding:2px 0;
  }
  .phase-desc:focus{ border-bottom:1px solid var(--accent); color:var(--ink); }

  .order-controls{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex-shrink:0;
  }
  .order-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:10px;
    padding:1px 4px;
    line-height:1;
  }
  .order-btn:hover{ color:var(--ink); }

  .category{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 18px;
    border-bottom:1px solid var(--line-soft);
    gap:12px;
  }
  .category-name{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
    outline:none;
    flex:1;
  }
  .category-totals-group{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .category-total{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
  }
  .category-total.recurring{
    color:var(--accent);
  }
  .items{ padding:4px 18px 14px; overflow-x:auto; }
  
  .item-row{
    display:grid;
    grid-template-columns:24px 1fr 40px 48px 75px 95px 105px 22px;
    gap:8px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line-soft);
    transition:opacity 0.2s;
    min-width:600px;
  }
  .item-row.deselected{
    opacity:0.45;
  }
  .item-row:last-of-type{ border-bottom:none; }
  .item-row input[type=text]{
    border:none;
    background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    outline:none;
    padding:4px 0;
    width:100%;
  }
  .item-row input[type=text]::placeholder{ color:#B6B1A6; }
  .item-row input[type=number]{
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    text-align:right;
    padding:4px 2px;
    width:100%;
    outline:none;
  }
  .item-row input[type=number]:focus, .item-row select:focus{ border-bottom:1px solid var(--accent); }
  .item-row select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:4px 0;
    outline:none;
    cursor:pointer;
  }
  .item-line-total{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    text-align:right;
    color:var(--muted);
  }
  .item-row.deselected .item-line-total{
    text-decoration:line-through;
  }
  .remove-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px;
  }
  .remove-btn:hover{ color:var(--danger); }
  .col-labels{
    display:grid;
    grid-template-columns:24px 1fr 40px 48px 75px 95px 105px 22px;
    gap:8px;
    padding:0 0 4px;
    font-size:10px;
    letter-spacing:0.04em;
    color:var(--muted);
    min-width:600px;
  }
  .col-labels span:not(:first-child):not(:nth-child(2)){ text-align:right; }

  .add-category{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .add-category button{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:2px;
    padding:9px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .add-category button:hover{ border-color:var(--accent); color:var(--accent); }
  .add-category .primary{
    background:var(--ink);
    color:#fff;
    border:1px solid var(--ink);
  }
  .add-category .primary:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .summary{
    border-top:2px solid var(--ink);
    padding-top:18px;
    margin-top:8px;
  }
  .summary-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .summary-row .bar-label{
    width:150px;
    font-size:13px;
    flex-shrink:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .summary-row .bar-track{
    flex:1;
    height:8px;
    background:var(--accent-soft);
    border-radius:1px;
    overflow:hidden;
  }
  .summary-row .bar-fill{ height:100%; background:var(--accent); }
  .summary-row .bar-amt{
    width:120px;
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    flex-shrink:0;
  }
  .grand-totals-wrapper{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
    gap:16px;
  }
  .grand-total-box{
    text-align:right;
  }
  .grand-total-box .label{ font-family:'Source Serif 4', serif; font-size:15px; font-weight:600; color:var(--muted); }
  .grand-total-box .amount{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:500; }
  .grand-total-box.primary .amount{ font-size:26px; color:var(--accent); }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:28px;
    gap:12px;
    flex-wrap:wrap;
  }
  .toolbar button{
    background:none;
    border:1px solid var(--line);
    border-radius:2px;
    padding:8px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
  }
  .toolbar button:hover{ border-color:var(--ink); }
  .save-status{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono', monospace; }

  @media (max-width:700px){
    .summary-row .bar-label{ width:100px; }
    .summary-row .bar-amt{ width:90px; font-size:11px; }
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(28,31,38,0.72);
    z-index:100;
    overflow-y:auto;
    padding:28px 16px;
  }
  .modal-overlay.active{ display:block; }
  .modal-bar{
    max-width:640px;
    margin:0 auto 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal-bar button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .modal-bar .close-btn{ background:none; border:1px solid #6B7280; color:#fff; }
  .modal-bar .download-btn{ background:var(--accent); border:1px solid var(--accent); color:#fff; }
  .doc-page{
    max-width:640px;
    margin:0 auto;
    background:#fff;
    padding:44px 40px;
    border-radius:2px;
  }
  .doc-header{ border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:22px; }
  .doc-label{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; color:var(--muted); margin-bottom:8px; }
  .doc-title{ font-family:'Source Serif 4', serif; font-size:26px; font-weight:600; margin-bottom:10px; }
  .doc-meta{ font-size:12px; color:var(--muted); display:flex; gap:18px; flex-wrap:wrap; }
  .doc-section-title{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; color:var(--muted); margin:22px 0 10px; text-transform:uppercase; }
  .doc-para{ font-size:14px; line-height:1.65; color:var(--ink); }
  .doc-phase{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
  .doc-phase:last-child{ border-bottom:none; }
  .doc-phase .n{ color:var(--accent); font-family:'IBM Plex Mono', monospace; font-size:12px; width:16px; flex-shrink:0; }
  .doc-phase .name{ font-weight:600; flex:1; }
  .doc-phase .dur{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); white-space:nowrap; }
  .doc-phase-desc{ font-size:12px; color:var(--muted); margin-top:2px; }
  .doc-cat{ margin-bottom:14px; }
  .doc-cat-head{ display:flex; justify-content:space-between; font-weight:600; font-size:14px; border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:6px; }
  .doc-table-header{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); border-bottom:1px solid var(--line-soft); padding-bottom:4px; margin-bottom:4px; }
  .doc-item-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:3px 0; }
  .doc-total{ display:flex; justify-content:space-between; border-top:2px solid var(--ink); margin-top:14px; padding-top:12px; font-family:'Source Serif 4', serif; font-size:18px; font-weight:600; }
  .doc-req-row{ display:flex; gap:8px; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line-soft); }
  .doc-req-row:last-child{ border-bottom:none; }
  .doc-req-row .mark{ color:var(--accent); }
  .doc-empty{ color:var(--muted); font-size:13px; font-style:italic; }

  .summary-row .bar-fill.recurring{ background:repeating-linear-gradient(45deg,var(--accent) 0 4px,var(--accent-soft) 4px 8px); }
  .terms-check{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted); text-align:right; margin-top:6px; }
  .terms-check.bad{ color:var(--danger); }
  @media print{
    body.modal-active > .wrap{ display:none !important; }
    body:not(.modal-active) .modal-overlay{ display:none !important; }
    .modal-overlay{ position:static !important; background:none !important; padding:0 !important; overflow:visible !important; }
    .modal-bar{ display:none !important; }
    .doc-page{ padding:0 !important; box-shadow:none !important; }
    body{ background:#fff; }
    .add-category, .btn-link, .remove-btn, .toolbar, .generator, .order-controls{ display:none !important; }
    .category{ border:1px solid #ccc; break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="modal-overlay" id="modal-proposal">
  <div class="modal-bar no-print">
    <button class="close-btn" id="close-proposal-modal">Close</button>
    <button class="download-btn" id="download-proposal-pdf">Download PDF</button>
  </div>
  <div class="doc-page" id="proposal-doc"></div>
</div>

<div class="modal-overlay" id="modal-requirements">
  <div class="modal-bar no-print">
    <button class="close-btn" id="close-requirements-modal">Close</button>
    <button class="download-btn" id="download-requirements-pdf">Download PDF</button>
  </div>
  <div class="doc-page" id="requirements-doc"></div>
</div>

<input type="file" id="json-input" accept=".json" style="display:none">

<script>
const STORAGE_KEY = 'website-proposal-budget:v1';

let state = {
  title: 'Quote',
  client: '',
  preparedBy: '',
  currency: '$',
  date: new Date().toISOString().slice(0,10),
  project: {
    name: '',
    overview: '',
    requirements: [
      { id: rid(), text: 'Written approval of scope and pricing' },
      { id: rid(), text: 'Access and materials needed from the client' },
    ]
  },
  timeline: {
    totalEstimate: '',
    phases: [
      { id: pid(), name: 'Planning', duration: '1 week', description: 'Scope confirmation, requirements, scheduling.' },
      { id: pid(), name: 'Preparation', duration: '1 week', description: 'Sourcing materials and setting up.' },
      { id: pid(), name: 'Delivery', duration: '2 weeks', description: 'Carrying out the agreed work.' },
      { id: pid(), name: 'Handover', duration: '1 week', description: 'Final checks, sign-off, handover.' },
    ]
  },
  terms: [
    { id: trid(), name: 'Deposit / Kickoff', pct: 50 },
    { id: trid(), name: 'Design Approval', pct: 25 },
    { id: trid(), name: 'Final Handover', pct: 25 }
  ],
  categories: [
    {
      id: cid(),
      name: 'Services',
      items: [
        { id: iid(), name: 'Main service', qty: 1, price: 0, frequency: 'one-time', selected: true },
      ]
    },
    {
      id: cid(),
      name: 'Operational Fees',
      items: [
        { id: iid(), name: 'Ongoing support', qty: 1, price: 0, frequency: 'monthly', selected: true },
      ]
    },
    {
      id: cid(),
      name: 'Contingency',
      items: [
        { id: iid(), name: 'Reserve (10% of base cost)', qty: 1, price: 0, frequency: 'one-time', selected: true },
      ]
    }
  ]
};

function cid(){ return 'c_' + Math.random().toString(36).slice(2,9); }
function iid(){ return 'i_' + Math.random().toString(36).slice(2,9); }
function rid(){ return 'r_' + Math.random().toString(36).slice(2,9); }
function pid(){ return 'p_' + Math.random().toString(36).slice(2,9); }
function trid(){ return 't_' + Math.random().toString(36).slice(2,9); }

function fmt(n){
  if (isNaN(n)) n = 0;
  const sym = state.currency || '$';
  return sym + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function calculateItemMonthlyCost(it){
  if (it.selected === false) return 0;
  const base = (Number(it.qty) || 0) * (Number(it.price) || 0);
  switch (it.frequency) {
    case 'weekly': return (base * 52) / 12;
    case 'monthly': return base;
    case 'yearly': return base / 12;
    case 'one-time': default: return 0;
  }
}

function calculateItemOneTimeCost(it){
  if (it.selected === false) return 0;
  if ((it.frequency || 'one-time') !== 'one-time') return 0;
  return (Number(it.qty) || 0) * (Number(it.price) || 0);
}

function itemDisplayTotal(it){
  if (it.selected === false) return 0;
  if (it.frequency === 'one-time') return calculateItemOneTimeCost(it);
  return calculateItemMonthlyCost(it);
}

function categoryOneTimeTotal(cat){
  return cat.items.reduce((s, it) => s + calculateItemOneTimeCost(it), 0);
}

function categoryMonthlyTotal(cat){
  return cat.items.reduce((s, it) => s + calculateItemMonthlyCost(it), 0);
}

function grandOneTimeTotal(){
  return state.categories.reduce((s, c) => s + categoryOneTimeTotal(c), 0);
}

function grandMonthlyTotal(){
  return state.categories.reduce((s, c) => s + categoryMonthlyTotal(c), 0);
}

async function saveState(){
  try{
    if (window.storage && window.storage.set) {
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    setStatus('Saved');
  }catch(e){
    setStatus('Save failed');
    console.error(e);
  }
}

function setStatus(msg){
  const el = document.getElementById('save-status');
  if (el) el.textContent = msg;
}

async function loadState(){
  try{
    let val = null;
    if (window.storage && window.storage.get) {
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res) val = res.value;
    } else {
      val = localStorage.getItem(STORAGE_KEY);
    }
    if (val){
      const parsed = JSON.parse(val);
      state = { ...state, ...parsed };
      if (!state.currency) state.currency = '$';
      if (!state.terms) state.terms = [];
      state.categories.forEach(c => {
        c.items.forEach(it => {
          if (it.selected === undefined) it.selected = true;
          if (!it.frequency) it.frequency = 'one-time';
        });
      });
    }
  }catch(e){
    // no saved state
  }
  render();
}

function moveItem(arr, idx, dir){
  const target = idx + dir;
  if (target < 0 || target >= arr.length) return;
  const temp = arr[idx];
  arr[idx] = arr[target];
  arr[target] = temp;
}

  el.className = 'terms-check' + (ok ? '' : ' bad');
  el.textContent = ok ? 'Total: 100%' : `Total: ${+sum.toFixed(2)}% — milestones should add up to 100%`;

async function generateFromSummary(){
  const btn = document.getElementById('generate-btn');
  const status = document.getElementById('generator-status');
  const summary = document.getElementById('summary-input').value.trim();

  if (!summary){
    status.textContent = 'Paste a project summary first';
    return;
  }

  const hasExisting = state.project.overview || state.project.requirements.some(r => r.text) || state.timeline.phases.length > 4;
  if (hasExisting && !confirm('This will replace the current overview, requirements, and timeline. Continue?')) return;

  btn.disabled = true;
  status.textContent = 'Generating...';

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `You are helping a freelancer turn a rough job summary into a structured quote draft. Given the summary below, respond with ONLY a raw JSON object (no markdown fences, no preamble, no explanation) with exactly this shape:

{
  "project_name": "short project name",
  "overview": "2-4 sentence overview of the quoted work, written to the client, professional tone",
  "requirements": ["thing needed from the client", "..."],
  "phases": [{"name": "phase name", "duration": "e.g. 1 week", "description": "1 sentence on what happens in this phase"}],
  "total_estimate": "e.g. 6 weeks",
  "category_suggestions": ["budget category name", "..."]
}

Rules:
- Number of phases should reflect the actual size/complexity of the project.
- requirements are things needed FROM the client.
- category_suggestions are budget category names only.

Project summary:
"""${summary}"""`
        }]
      })
    });

    if (!response.ok) throw new Error('API request failed: ' + response.status);

    const data = await response.json();
    const textBlock = data.content.find(b => b.type === 'text');
    if (!textBlock) throw new Error('No text in response');

    let cleaned = textBlock.text.trim().replace(/^```json\s*/i, '').replace(/^```\s*/,'').replace(/```\s*$/,'');
    const parsed = JSON.parse(cleaned);

    state.project.name = parsed.project_name || state.project.name;
    state.project.overview = parsed.overview || '';
    state.project.requirements = (parsed.requirements || []).map(text => ({ id: rid(), text }));
    state.timeline.phases = (parsed.phases || []).map(p => ({
      id: pid(), name: p.name || '', duration: p.duration || '', description: p.description || ''
    }));
    state.timeline.totalEstimate = parsed.total_estimate || '';

    if (Array.isArray(parsed.category_suggestions)){
      parsed.category_suggestions.forEach(name => {
        if (!state.categories.some(c => c.name.toLowerCase() === String(name).toLowerCase())){
          state.categories.push({ id: cid(), name: name, items: [{ id: iid(), name: '', qty: 1, price: 0, frequency: 'one-time', selected: true }] });
        }
      });
    }

    render();
    document.getElementById('summary-input').value = summary;
    document.getElementById('generator-status').textContent = 'Generated — review below';
    saveState();
  }catch(e){
    console.error(e);
    status.textContent = 'Generation failed — try again';
  }finally{
    btn.disabled = false;
  }
}

  const rows = document.getElementById('summary-rows');
  const gtOne = grandOneTimeTotal();
  
  rows.innerHTML = state.categories.map(cat => {
    const cOne = categoryOneTimeTotal(cat);
    const cMon = categoryMonthlyTotal(cat);
    const gtMonAll = grandMonthlyTotal();
    const recurringOnly = cOne === 0 && cMon > 0;
    const pct = recurringOnly
      ? (gtMonAll > 0 ? cMon / gtMonAll * 100 : 0)
      : (gtOne > 0 ? cOne / gtOne * 100 : 0);
    
    let amtStr = '';
    if (cOne > 0 && cMon > 0) amtStr = `${fmt(cOne)} + ${fmt(cMon)}/mo`;
    else if (cMon > 0) amtStr = `${fmt(cMon)}/mo`;
    else amtStr = fmt(cOne);

    return `
      <div class="summary-row">
        <div class="bar-label">${escapeHtml(cat.name || 'Untitled')}</div>
        <div class="bar-track"><div class="bar-fill${recurringOnly ? ' recurring' : ''}" style="width:${pct}%"></div></div>
        <div class="bar-amt">${amtStr}</div>
      </div>
    `;
  }).join('');
}

  });

  document.getElementById('add-blank-category').addEventListener('click', () => {
    state.categories.push({ id: cid(), name: 'New category', items: [{ id: iid(), name: '', qty: 1, price: 0, frequency: 'one-time', selected: true }] });
    render();
    saveState();
  });

  document.querySelectorAll('.add-category button[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const presetName = btn.dataset.preset;
      const defaultFreq = (presetName === 'Operational Fees' || presetName === 'Maintenance & Support') ? 'monthly' : 'one-time';
      state.categories.push({ id: cid(), name: presetName, items: [{ id: iid(), name: '', qty: 1, price: 0, frequency: defaultFreq, selected: true }] });
      render();
      saveState();
    });
  });
}

function attachCategoryListeners(){
  document.querySelectorAll('.category-name').forEach(el => {
    el.addEventListener('blur', e => {
      const cat = state.categories.find(c => c.id === e.target.dataset.cat);
      if (cat) cat.name = e.target.textContent.trim() || 'Untitled';
      renderSummary();
      saveState();
    });
  });

  document.querySelectorAll('.cat-up').forEach(btn => {
    btn.addEventListener('click', e => {
      moveItem(state.categories, Number(e.target.dataset.idx), -1);
      render();
      saveState();
    });
  });
  document.querySelectorAll('.cat-down').forEach(btn => {
    btn.addEventListener('click', e => {
      moveItem(state.categories, Number(e.target.dataset.idx), 1);
      render();
      saveState();
    });
  });

  document.querySelectorAll('.remove-category').forEach(el => {
    el.addEventListener('click', e => {
      state.categories = state.categories.filter(c => c.id !== e.target.dataset.cat);
      render();
      saveState();
    });
  });

  document.querySelectorAll('.add-item-btn').forEach(el => {
    el.addEventListener('click', e => {
      const cat = state.categories.find(c => c.id === e.target.dataset.cat);
      if (cat) cat.items.push({ id: iid(), name: '', qty: 1, price: 0, frequency: 'one-time', selected: true });
      render();
      saveState();
    });
  });

  document.querySelectorAll('.item-up').forEach(btn => {
    btn.addEventListener('click', e => {
      const cat = state.categories.find(c => c.id === e.target.dataset.cat);
      if (cat) moveItem(cat.items, Number(e.target.dataset.idx), -1);
      render();
      saveState();
    });
  });
  document.querySelectorAll('.item-down').forEach(btn => {
    btn.addEventListener('click', e => {
      const cat = state.categories.find(c => c.id === e.target.dataset.cat);
      if (cat) moveItem(cat.items, Number(e.target.dataset.idx), 1);
      render();
      saveState();
    });
  });

  document.querySelectorAll('.remove-item').forEach(el => {
    el.addEventListener('click', e => {
      const cat = state.categories.find(c => c.id === e.target.dataset.cat);
      if (cat) cat.items = cat.items.filter(it => it.id !== e.target.dataset.item);
      render();
      saveState();
    });
  });

  document.querySelectorAll('.item-row input, .item-row select').forEach(el => {
    const handleUpdate = (e) => {
      const cat = state.categories.find(c => c.id === e.target.dataset.cat);
      if (!cat) return;
      const item = cat.items.find(it => it.id === e.target.dataset.item);
      if (!item) return;
      const field = e.target.dataset.field;

      if (field === 'selected') {
        item.selected = e.target.checked;
        render();
        saveState();
        return;
      } else if (field === 'name' || field === 'frequency') {
        item[field] = e.target.value;
      } else {
        item[field] = Number(e.target.value);
      }

      if (field === 'frequency') {
        render();
        saveState();
        return;
      }

      const onetime = categoryOneTimeTotal(cat);
      const monthly = categoryMonthlyTotal(cat);
      const catGroupEl = document.querySelector(`.category[data-cat="${cat.id}"] .category-totals-group`);
      if (catGroupEl) {
        let html = '';
        if (onetime > 0) html += `<span class="category-total">${fmt(onetime)}</span>`;
        if (monthly > 0) html += `<span class="category-total recurring">${fmt(monthly)}/mo</span>`;
        if (onetime === 0 && monthly === 0) html += `<span class="category-total">${fmt(0)}</span>`;
        catGroupEl.innerHTML = html;
      }

      const rowTotalEl = document.querySelector(`.item-row[data-cat="${cat.id}"][data-item="${item.id}"] .item-line-total`);
      if (rowTotalEl) {
        const lineVal = itemDisplayTotal(item);
        rowTotalEl.textContent = item.selected ? (item.frequency === 'one-time' ? fmt(lineVal) : fmt(lineVal) + '/mo') : 'Excluded';
      }

      renderSummary();
      updateTermAmounts();
      
      const gtOneEl = document.getElementById('gt-onetime-amt');
      if (gtOneEl) gtOneEl.textContent = fmt(grandOneTimeTotal());
      const gtMonEl = document.getElementById('gt-monthly-amt');
      if (gtMonEl) gtMonEl.textContent = fmt(grandMonthlyTotal()) + '/mo';
    };

    el.addEventListener('input', handleUpdate);
    el.addEventListener('change', handleUpdate);
    el.addEventListener('blur', saveState);
  });
}

function buildProposalDocHTML(){
  const gtOne = grandOneTimeTotal();
  const gtMon = grandMonthlyTotal();
  const name = state.project.name || state.title || 'Untitled Project';
  return `
    <div class="doc-header">
      <div class="doc-label">QUOTE</div>
      <div class="doc-title">${escapeHtml(name)}</div>
      <div class="doc-meta">
        ${state.client ? `<span>Client: ${escapeHtml(state.client)}</span>` : ''}
        ${state.preparedBy ? `<span>Prepared by: ${escapeHtml(state.preparedBy)}</span>` : ''}
        <span>Date: ${escapeHtml(state.date)}</span>
      </div>
    </div>

    ${state.project.overview ? `
      <div class="doc-section-title">Overview</div>
      <div class="doc-para">${escapeHtml(state.project.overview)}</div>
    ` : ''}

    ${state.timeline.phases.length ? `
      <div class="doc-section-title">Timeline${state.timeline.totalEstimate ? ' — est. ' + escapeHtml(state.timeline.totalEstimate) : ''}</div>
      ${state.timeline.phases.map((ph, idx) => `
        <div class="doc-phase">
          <span class="n">${idx + 1}</span>
          <div style="flex:1">
            <div style="display:flex; justify-content:space-between;">
              <span class="name">${escapeHtml(ph.name)}</span>
              <span class="dur">${escapeHtml(ph.duration)}</span>
            </div>
            ${ph.description ? `<div class="doc-phase-desc">${escapeHtml(ph.description)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    ` : ''}

    <div class="doc-section-title">Budget Details</div>
    ${state.categories.length ? state.categories.map(cat => {
      const cOne = categoryOneTimeTotal(cat);
      const cMon = categoryMonthlyTotal(cat);
      let totalStr = '';
      if (cOne > 0 && cMon > 0) totalStr = `${fmt(cOne)} + ${fmt(cMon)}/mo`;
      else if (cMon > 0) totalStr = `${fmt(cMon)}/mo`;
      else totalStr = fmt(cOne);

      return `
        <div class="doc-cat">
          <div class="doc-cat-head"><span>${escapeHtml(cat.name)}</span><span>${totalStr}</span></div>
          <div class="doc-table-header"><span>Item (Qty × Rate)</span><span>Subtotal</span></div>
          ${cat.items.filter(it => it.selected !== false).map(it => {
            const lineVal = itemDisplayTotal(it);
            const freqStr = (it.frequency || 'one-time') === 'one-time' ? '' : ` (${it.frequency})`;
            return `
              <div class="doc-item-row">
                <span>${escapeHtml(it.name || 'Untitled item')} (${it.qty} × ${fmt(Number(it.price)||0)}${freqStr})</span>
                <span>${it.frequency === 'one-time' ? fmt(lineVal) : fmt(lineVal) + '/mo'}</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }).join('') : '<div class="doc-empty">No budget items yet.</div>'}

    <div class="doc-total"><span>Upfront Project Total</span><span>${fmt(gtOne)}</span></div>
    ${gtMon > 0 ? `<div class="doc-total" style="border-top:none; margin-top:4px; padding-top:0; color:var(--accent);"><span>Recurring Total</span><span>${fmt(gtMon)}/mo</span></div>` : ''}

    ${state.terms.length ? `
      <div class="doc-section-title">Payment Milestones (Upfront Fees)</div>
      ${state.terms.map(t => `
        <div class="doc-item-row" style="color:var(--ink)">
          <span>${escapeHtml(t.name)} (${t.pct}%)</span>
          <span style="font-family:'IBM Plex Mono', monospace;">${fmt((gtOne * (Number(t.pct)||0)) / 100)}</span>
        </div>
      `).join('')}
    ` : ''}
  `;
}

function buildRequirementsDocHTML(){
  const name = state.project.name || state.title || 'Untitled Project';
  return `
    <div class="doc-header">
      <div class="doc-label">CLIENT REQUIREMENTS</div>
      <div class="doc-title">${escapeHtml(name)}</div>
      <div class="doc-meta">
        ${state.client ? `<span>Client: ${escapeHtml(state.client)}</span>` : ''}
        <span>Date: ${escapeHtml(state.date)}</span>
      </div>
    </div>
    <div class="doc-section-title">What we need from you</div>
    ${state.project.requirements.length ? state.project.requirements.map(r => `
      <div class="doc-req-row"><span class="mark">—</span><span>${escapeHtml(r.text || 'Untitled requirement')}</span></div>
    `).join('') : '<div class="doc-empty">No requirements added yet.</div>'}
  `;
}

function proposalPlainText(){
  const gtOne = grandOneTimeTotal();
  const gtMon = grandMonthlyTotal();
  const name = state.project.name || state.title || 'Untitled Project';
  let text = `${name}\n`;
  if (state.client) text += `Client: ${state.client}\n`;
  if (state.preparedBy) text += `Prepared by: ${state.preparedBy}\n`;
  text += `Date: ${state.date}\n\n`;
  if (state.project.overview) text += `OVERVIEW\n${state.project.overview}\n\n`;
  if (state.timeline.phases.length){
    text += `TIMELINE${state.timeline.totalEstimate ? ' (est. ' + state.timeline.totalEstimate + ')' : ''}\n`;
    state.timeline.phases.forEach((ph, idx) => {
      text += `${idx + 1}. ${ph.name}${ph.duration ? ' — ' + ph.duration : ''}\n`;
      if (ph.description) text += `   ${ph.description}\n`;
    });
    text += `\n`;
  }
  text += `BUDGET\n`;
  state.categories.forEach(cat => {
    const cOne = categoryOneTimeTotal(cat);
    const cMon = categoryMonthlyTotal(cat);
    let totalStr = cOne > 0 && cMon > 0 ? `${fmt(cOne)} + ${fmt(cMon)}/mo` : (cMon > 0 ? `${fmt(cMon)}/mo` : fmt(cOne));
    text += `${cat.name} — ${totalStr}\n`;
    cat.items.filter(it => it.selected !== false).forEach(it => {
      const lineVal = itemDisplayTotal(it);
      const suffix = it.frequency === 'one-time' ? '' : '/mo';
      text += `  - ${it.name || 'Untitled item'}: ${it.qty} x ${fmt(Number(it.price)||0)} (${it.frequency || 'one-time'}) = ${fmt(lineVal)}${suffix}\n`;
    });
  });
  text += `\nUPFRONT TOTAL: ${fmt(gtOne)}\n`;
  if (gtMon > 0) text += `RECURRING TOTAL: ${fmt(gtMon)}/mo\n`;
  text += `\n`;

  if (state.terms.length){
    text += `PAYMENT MILESTONES (UPFRONT FEES)\n`;
    state.terms.forEach(t => {
      text += `- ${t.name}: ${t.pct}% (${fmt((gtOne * (Number(t.pct)||0)) / 100)})\n`;
    });
  }
  return text;
}

function requirementsPlainText(){
  const name = state.project.name || state.title || 'Untitled Project';
  let text = `${name} — Client Requirements\n`;
  if (state.client) text += `Client: ${state.client}\n`;
  text += `Date: ${state.date}\n\n`;
  state.project.requirements.forEach(r => {
    if (r.text) text += `- ${r.text}\n`;
  });
  return text;
}

function downloadTextFile(filename, text, type='text/plain'){
  const blob = new Blob([text], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function slugify(str){
  return (str || 'proposal').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'proposal';
}

function openModal(id){
  document.getElementById(id).classList.add('active');
  document.body.classList.add('modal-active');
}
function closeModal(id){
  document.getElementById(id).classList.remove('active');
  document.body.classList.remove('modal-active');
}

function attachToolbarListeners(){
  document.getElementById('preview-proposal-btn').addEventListener('click', () => {
    document.getElementById('proposal-doc').innerHTML = buildProposalDocHTML();
    openModal('modal-proposal');
  });
  document.getElementById('preview-requirements-btn').addEventListener('click', () => {
    document.getElementById('requirements-doc').innerHTML = buildRequirementsDocHTML();
    openModal('modal-requirements');
  });
  document.getElementById('close-proposal-modal').addEventListener('click', () => closeModal('modal-proposal'));
  document.getElementById('close-requirements-modal').addEventListener('click', () => closeModal('modal-requirements'));
  
  document.getElementById('download-proposal-pdf').addEventListener('click', () => window.print());
  document.getElementById('download-requirements-pdf').addEventListener('click', () => window.print());

  document.getElementById('txt-proposal-btn').addEventListener('click', () => {
    const name = state.project.name || state.title;
    downloadTextFile(slugify(name) + '-quote.txt', proposalPlainText());
    setStatus('Quote .txt downloaded');
  });

  document.getElementById('txt-requirements-btn').addEventListener('click', () => {
    const name = state.project.name || state.title;
    downloadTextFile(slugify(name) + '-requirements.txt', requirementsPlainText());
    setStatus('Requirements .txt downloaded');
  });

  document.getElementById('export-json-btn').addEventListener('click', () => {
    const name = state.project.name || state.title;
    downloadTextFile(slugify(name) + '-state.json', JSON.stringify(state, null, 2), 'application/json');
    setStatus('JSON exported');
  });

  document.getElementById('import-json-btn').addEventListener('click', () => {
    document.getElementById('json-input').click();
  });

  document.getElementById('json-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (imported && typeof imported === 'object') {
          state = { ...state, ...imported };
          state.categories.forEach(c => {
            c.items.forEach(it => {
              if (it.selected === undefined) it.selected = true;
              if (!it.frequency) it.frequency = 'one-time';
            });
          });
          render();
          saveState();
          setStatus('JSON imported');
        }
      } catch (err) {
        alert('Invalid JSON file.');
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Start a new quote? This clears the current one.')) return;
    state = {
      title: 'Quote',
      client: '',
      preparedBy: '',
      currency: '$',
      date: new Date().toISOString().slice(0,10),
      project: { name: '', overview: '', requirements: [] },
      timeline: { totalEstimate: '', phases: [] },
      terms: [],
      categories: [
        { id: cid(), name: 'Services', items: [{ id: iid(), name: '', qty: 1, price: 0, frequency: 'one-time', selected: true }] }
      ]
    };
    render();
    saveState();
  });
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

loadState();
